apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.onepieceapp.serviceName }}
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.onepieceapp.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.onepieceapp.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.onepieceapp.serviceName | quote }}
        version: {{ .Values.onepieceapp.image.tag | quote }}
        web: "onepieceapp"
    spec:
      containers:
        - name: {{ .Values.onepieceapp.serviceName }}
          image: "{{ .Values.onepieceapp.image.repository }}:{{ .Values.onepieceapp.image.tag }}"
          imagePullPolicy: IfNotPresent
          env:
            - name: VERSION
              value: "{{ .Values.onepieceapp.image.tag }}"
          livenessProbe:
            exec:
              command: {{ .Values.onepieceapp.livenessProbe.execCommand | toJson }}
            failureThreshold: {{ .Values.onepieceapp.livenessProbe.failureThreshold }}
            periodSeconds: {{ .Values.onepieceapp.livenessProbe.periodSeconds }}
            successThreshold: {{ .Values.onepieceapp.livenessProbe.successThreshold }}
            timeoutSeconds: {{ .Values.onepieceapp.livenessProbe.timeoutSeconds }}
          ports:
            - containerPort: {{ .Values.onepieceapp.port }}
              protocol: TCP
          env:
          - name: MYSQL_HOST
            valueFrom:
              secretKeyRef:
                name: onepiece-db-secret
                key: hostaddrdb
          - name: MYSQL_PASSWORD
            valueFrom:
              secretKeyRef:
                name: onepiece-db-secret
                key: passwordb
          - name: MYSQL_DB
            valueFrom:
              secretKeyRef:
                name: onepiece-db-secret
                key: databasename
          - name: MYSQL_USER
            valueFrom:
              secretKeyRef:
                name: onepiece-db-secret
                key: usernamedb
