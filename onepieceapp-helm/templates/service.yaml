apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.onepieceapp.serviceName }}
  namespace: {{ .Values.namespace }}
spec:
  ports:
    - port: {{ .Values.onepieceapp.port }}
      targetPort: {{ .Values.onepieceapp.port }}
  selector:
    app: {{ .Values.onepieceapp.serviceName }}
  type: ClusterIP