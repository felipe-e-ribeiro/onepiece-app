stages:
  - check-tag
  - generate-assets
  - build-and-push


# ------------------------------------------------
check_tag:
  stage: check-tag
  script:
    - echo "Checking for release tag..."
    - TAG_NAME="${CI_COMMIT_TAG}"
    - if [ -z "$TAG_NAME" ]; then echo "No tag found." && exit 1; fi
    - echo "TAG_NAME=$TAG_NAME" > tag_output.env
  artifacts:
    reports:
      dotenv: tag_output.env
  only:
    - tags


# ------------------------------------------------
generate_assets:
  stage: generate-assets
  image: python:3.12-slim

  before_script:
    - cd website
    - python -m venv .venv
    - . .venv/bin/activate
    - pip install --upgrade pip
    - pip install -r requirements.txt

  script:
    - python volume_update.py

  artifacts:
    paths:
      - website/static/
      - website/my_database.db
    expire_in: 1 hour

  only:
    - tags


# ------------------------------------------------
build_and_push:
  stage: build-and-push
  image: docker:20.10.24
  services:
    - docker:20.10.24-dind

  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""

  dependencies:
    - generate_assets

  script:
    - echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USER" --password-stdin

    - docker buildx create --use

    - docker buildx build \
        --push \
        --tag "$DOCKER_USER/onepiece-app:latest" \
        --tag "$DOCKER_USER/onepiece-app:$CI_COMMIT_TAG" \
        --platform linux/amd64,linux/arm64 \
        ./website

  only:
    - tags