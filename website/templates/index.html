<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minha Biblioteca</title>
    <style>
        body {
            background-color: #212529;
        }

        .card {
            margin: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
            width: 250px;
        }

        .card:hover {
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
        }

        .container {
            padding: 2px 16px;
        }

        img {
            width: 100%;
        }
    </style>
</head>
<body>
    <h1 style="color: #fff; text-align: center">Volumes One Piece</h1>
    {% if message %}
        <div><strong>{{ message }}</strong></div>
    {% endif %}
    <div style="display: flex; flex-wrap: wrap; justify-content: center;">
        {% for edition in editions %}
            <div class="card">
                {% if edition[2] %}
                    <a href="http://onepiece.feliperibeiro.link/edit/{{edition[0]}}" ><img src="{{ url_for('static', filename='owned_book.jpg') }}" alt="Livro Possuído"></a>
                    <p  style="color: #fff; text-align: center">Volume: {{ edition[0] }} OK</p>
                {% else %}
                    <a href="http://onepiece.feliperibeiro.link/edit/{{edition[0]}}" ><img src="{{ url_for('static', filename='unowned_book.jpg') }}" href="http://onepiece.feliperibeiro.link/edit/{{edition[0]}}"  alt="Livro Não Possuído"></a>
                    <p  style="color: #fff; text-align: center">Volume: {{ edition[0] }} Faltando</p>
                {% endif %}
            </div>
        {% endfor %}
    </div>
</body>
</html>
