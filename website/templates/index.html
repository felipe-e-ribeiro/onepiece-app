
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manga Collection</title>
    <link rel="stylesheet" href="{{ css_url }}">
</head>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
  <main>
    
    {% if message %}

    {% endif %}
          {% for edition in editions %}
          <section class="arc">
            <h2>{{ edition[0] }}</h2>
                <div class="manga-grid">
                        {% for volume in edition[1].split(',') %}
                          {% set index = owned[volume|int - 1] %}
                            {% if index[1] %}
                            <div class="manga-item-owened">
                            <a href="http://onepiece.feliperibeiro.link/edit/{{volume}}"><img src="{{ url_for('static', filename='Volume_' + volume + '.png') }}" alt="Volume 1"></a>
                            <div class="name">Volume {{ volume }}</div>
                            </div>
                            {% else %}
                            <div class="manga-item-not-owned">
                            <a href="http://onepiece.feliperibeiro.link/edit/{{volume}}"><img src="{{ url_for('static', filename='Volume_' + volume + '.png') }}" alt="Volume 1"></a>
                            <div class="name">Volume {{ volume }}</div>
                            </div>
                            {% endif %}


                      {% endfor %}
            </section>
        </div>
        {% endfor %}
  </body>
</main>
</html>
