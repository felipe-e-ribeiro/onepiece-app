<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Edit</title>
  <link rel="stylesheet" href="/static/style.css">
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: vh;
      margin: 0;
    }
    .edit {
      text-align: center;
    }
    .manga-item-edit {
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .btn-group {
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <section class="edit">
    <h1>Alterando o volume 100</h1>
    <div class="manga-item-edit">
      <img src="/static/Volume_100.png" alt="Volume 1">
    </div>
    <form method="post">
      <label class="container">
        <input type="checkbox" name="is_owned" checked>Na cole&ccedil;&atilde;o?
        <span class="checkmark"></span>
        <div class="btn-group"><button type="submit">Salvar</button></div>
      </label>
    </form>
  </section>
</body>
</html>
