<!DOCTYPE html>
<head>
  <meta charset="UTF-8">
  <title>Edit</title>
  <style>
      body {
          background-color: #212529;
      }

      h1 {
        color: white;
      }

      label {
        color: white;
      }

      .card {
          margin: 10px;
          display: inline-block;
          box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
          transition: 0.3s;
          width: 250px;
      }


      .card:hover {
          box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);
      }

      .container {
          padding: 2px 16px;
      }

      img {
          width: 100%;
      }
  </style>

  <body>
    <h1 style="color: #fff">Alterando o volume {{ edition[1] }}</h1>
    <form method="post">
      <label>
        <input type="checkbox" name="is_owned"  {% if edition[2] %}checked{% endif %}>
        Na cole&ccedil;&atilde;o?
      </label>
      <button type="submit">Salvar</button>
    </form>
  </body>
</html
